<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>People Search</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="container">
    <header>
      <h1>People Search</h1>
      <nav>
        <ul>
          <li><a href="index.html">People search</a></li>
          <li><a href="vehicle-search.html">Vehicle search</a></li>
          <li><a href="add-vehicle.html">Add a vehicle</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div class="search-box">
        <form onsubmit="searchPeople(); return false;">
          <label for="name">Search by driver name</label>
          <input id="name" type="text" />

          <label for="license">Search by driving license number</label>
          <input id="license" type="text" />

          <button type="submit">Submit</button>
        </form>
      </div>

      <div class="results-box">
        <div id="message"></div>
        <div id="results"></div>
      </div>
    </main>

    <aside>
      <img src="https://via.placeholder.com/150" alt="people image" />
    </aside>

    <footer>
      <p>This is a sample for the COMP1004 coursework.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.6"></script>
  <script src="script.js"></script>
</body>
</html>
